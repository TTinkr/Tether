name: Community source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/public_check.py --revision HEAD
      - run: swift test --jobs 2 --no-parallel
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      # Private review artifacts only. Source CI remains useful in public forks.
      - name: Build pinned Parakeet runtime
        if: github.event_name == 'push' && github.event.repository.private
        run: |
          test "$(uname -m)" = arm64
          git init "$RUNNER_TEMP/transcribe.cpp"
          git -C "$RUNNER_TEMP/transcribe.cpp" remote add origin https://github.com/handy-computer/transcribe.cpp.git
          git -C "$RUNNER_TEMP/transcribe.cpp" fetch --depth 1 origin e0d5e6174bd5cceecfed4f1bb04d160bddb59f8f
          git -C "$RUNNER_TEMP/transcribe.cpp" checkout --detach FETCH_HEAD
          zsh scripts/transcribe/build_worker.sh "$RUNNER_TEMP/transcribe.cpp" "$RUNNER_TEMP/transcribe-stage"
      - name: Package private Parakeet preview
        if: github.event_name == 'push' && github.event.repository.private
        run: |
          python3 scripts/package_app.py --mode preview --build-number 82 --resources-dir Resources/Release --transcribe-worker "$RUNNER_TEMP/transcribe-stage"
          python3 - <<'PYCODE'
          import pathlib, subprocess
          app, = pathlib.Path("dist").glob("*/Tokens Community.app")
          subprocess.run(["ditto", "-c", "-k", "--keepParent", str(app), str(app.parent / "Tokens-Community-Parakeet.zip")], check=True)
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.event.repository.private
        with:
          name: private-parakeet-preview
          path: |
            dist/*/Tokens-Community-Parakeet.zip
            dist/*/package-receipt.json
            dist/*/source-manifest.json
          if-no-files-found: error
          retention-days: 7
